<ec-date-time-input
  #inputStart
  [label]="commonStrings.keys.timeRangeFilter.from"
  [disabled]="disabled()"
  [withTime]="withTime()"
  [(value)]="visualRange.start"
/>

<ec-date-time-input
  #inputEnd
  [label]="commonStrings.keys.timeRangeFilter.to"
  [disabled]="disabled()"
  [withTime]="withTime()"
  [(value)]="visualRange.end"
/>

<div class="apply-discard-group">
  <button
    type="button"
    class="btn btn-sm btn-primary"
    [disabled]="!forceEnabledButtons() && (disabled() || !isRangeModified || isAnyInputInvalid)"
    (click)="onApply()"
  >
    <!-- <clr-icon shape="check" /> -->
    {{ commonStrings.keys.timeRangeFilter.apply }}
  </button>
  <button
    type="button"
    class="btn btn-sm btn-outline"
    [disabled]="!forceEnabledButtons() && (disabled() || (!isRangeModified && !isAnyInputInvalid))"
    (click)="onDiscard()"
  >
    <!-- <clr-icon shape="undo" /> -->
    {{ commonStrings.keys.timeRangeFilter.discard }}
  </button>
</div>
